[time]
# Accepts "system", "UTC", or "UTC±HH:MM".
timezone = "UTC"

[srim]
# Absolute SRIM installation root.
# Escape Windows backslashes by doubling them.
root = "D:\\local\\srim\\srim_2013_std"
# true: request hidden SRModule windows; false: use normal window display.
# Also applies to Bragg runs. Defaults to true; CAB capture GUI is unaffected.
hide_sr_window = true
# true: request hidden TRIM windows; false: use normal window display.
# Defaults to true. Report-only execution leaves native popups unanswered.
hide_trim_window = true
